# MinIO — object store đóng vai trò Data Lake cho tầng Bronze.
# + Hive Metastore (Postgres-backed) và Trino — query engine đọc trực tiếp Bronze
#   (Parquet phân vùng thư mục, chưa phải Iceberg). Spark/Airflow sẽ gắn vào sau.
services:
  minio:
    image: minio/minio:latest          # có image arm64 chính thức, chạy tốt trên M-series
    container_name: lakehouse-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"                     # S3 API endpoint
      - "9001:9001"                     # Web console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Job chạy 1 lần: tạo sẵn bucket 'lakehouse' để pipeline có chỗ ghi.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb --ignore-existing local/lakehouse;
      mc anonymous set none local/lakehouse;
      echo '==> Bucket lakehouse san sang';
      "

  # DB backend cho Hive Metastore (bảng metadata: schema/table/partition).
  # Image hive-metastore bên dưới có sẵn schematool -dbType mysql -> phải dùng MySQL.
  metastore-db:
    image: mysql:8.0
    container_name: lakehouse-metastore-db
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: metastore_db
      MYSQL_USER: ${HIVE_METASTORE_DB_USER:-hive}
      MYSQL_PASSWORD: ${HIVE_METASTORE_DB_PASSWORD:-hive}
      MYSQL_ROOT_PASSWORD: ${HIVE_METASTORE_DB_PASSWORD:-hive}
    volumes:
      - metastore-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${HIVE_METASTORE_DB_PASSWORD:-hive}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Hive Metastore độc lập: cho Trino biết bảng nào trỏ vào đâu trên MinIO.
  # Không có env var tiện cho JDBC/S3 -> ghi đè bằng file conf trong hive-metastore/conf/.
  hive-metastore:
    image: bitsondatadev/hive-metastore:latest
    container_name: lakehouse-hive-metastore
    depends_on:
      metastore-db:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      METASTORE_DB_HOSTNAME: metastore-db
    volumes:
      - ./hive-metastore/conf/metastore-site.xml:/opt/apache-hive-metastore-3.0.0-bin/conf/metastore-site.xml:ro
      - ./hive-metastore/conf/core-site.xml:/opt/hadoop-3.2.0/etc/hadoop/core-site.xml:ro

  # Query engine: đọc Bronze qua Hive connector (Parquet phân vùng thư mục).
  trino:
    image: trinodb/trino:latest
    container_name: lakehouse-trino
    depends_on:
      - hive-metastore
    ports:
      - "8080:8080"          # Web UI + client API
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - ./trino/catalog:/etc/trino/catalog:ro

volumes:
  minio-data:
  metastore-db-data:
