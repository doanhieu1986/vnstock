# MinIO — object store đóng vai trò Data Lake cho tầng Bronze.
# + Hive Metastore (MySQL-backed) và Trino — query engine đọc trực tiếp Bronze
#   (Parquet phân vùng thư mục, chưa phải Iceberg).
# + Airflow — schedule ingest hằng ngày (DAG ở airflow/dags/, gọi lại CLI có sẵn).
x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: airflow/Dockerfile
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow_db
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/vnstock/airflow/dags
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    # Pipeline nói chuyện qua hostname trong mạng compose, khác localhost mà .env dùng khi chạy trên host.
    MINIO_ENDPOINT: http://minio:9000
    MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
    MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    LAKEHOUSE_BUCKET: ${LAKEHOUSE_BUCKET:-lakehouse}
    BRONZE_PREFIX: ${BRONZE_PREFIX:-bronze}
    VNSTOCK_SOURCE: ${VNSTOCK_SOURCE:-KBS}
    VNSTOCK_API_KEY: ${VNSTOCK_API_KEY:-}
    # Cao hơn .env (3s): mỗi lần gọi OHLCV có vẻ tốn hơn 1 request thực tế
    # (quan sát được: sleep 3-4s vẫn chạm rate limit Guest ~20 req/phút giữa
    # chừng VN30). DAG chạy không người giám sát nên cần biên an toàn rộng hơn.
    INGEST_SLEEP_SECONDS: ${INGEST_SLEEP_SECONDS:-6}
    TRINO_HOST: trino
    TRINO_PORT: 8080
  volumes:
    - .:/opt/airflow/vnstock
    - ./airflow/logs:/opt/airflow/logs
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    airflow-db:
      condition: service_healthy

services:
  minio:
    image: minio/minio:latest          # có image arm64 chính thức, chạy tốt trên M-series
    container_name: lakehouse-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"                     # S3 API endpoint
      - "9001:9001"                     # Web console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Job chạy 1 lần: tạo sẵn bucket 'lakehouse' để pipeline có chỗ ghi.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb --ignore-existing local/lakehouse;
      mc anonymous set none local/lakehouse;
      echo '==> Bucket lakehouse san sang';
      "

  # DB backend cho Hive Metastore (bảng metadata: schema/table/partition).
  # Image hive-metastore bên dưới có sẵn schematool -dbType mysql -> phải dùng MySQL.
  metastore-db:
    image: mysql:8.0
    container_name: lakehouse-metastore-db
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: metastore_db
      MYSQL_USER: ${HIVE_METASTORE_DB_USER:-hive}
      MYSQL_PASSWORD: ${HIVE_METASTORE_DB_PASSWORD:-hive}
      MYSQL_ROOT_PASSWORD: ${HIVE_METASTORE_DB_PASSWORD:-hive}
    volumes:
      - metastore-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${HIVE_METASTORE_DB_PASSWORD:-hive}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Hive Metastore độc lập: cho Trino biết bảng nào trỏ vào đâu trên MinIO.
  # Không có env var tiện cho JDBC/S3 -> ghi đè bằng file conf trong hive-metastore/conf/.
  hive-metastore:
    image: bitsondatadev/hive-metastore:latest
    container_name: lakehouse-hive-metastore
    depends_on:
      metastore-db:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      METASTORE_DB_HOSTNAME: metastore-db
    volumes:
      - ./hive-metastore/conf/metastore-site.xml:/opt/apache-hive-metastore-3.0.0-bin/conf/metastore-site.xml:ro
      - ./hive-metastore/conf/core-site.xml:/opt/hadoop-3.2.0/etc/hadoop/core-site.xml:ro

  # Query engine: đọc Bronze qua Hive connector (Parquet phân vùng thư mục).
  trino:
    image: trinodb/trino:latest
    container_name: lakehouse-trino
    depends_on:
      - hive-metastore
    ports:
      - "8080:8080"          # Web UI + client API
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - ./trino/catalog:/etc/trino/catalog:ro

  # Data processing: Bronze -> Silver (Iceberg), dùng lại hive-metastore làm catalog.
  # Không chạy thường trực — gọi qua `docker compose run --rm spark spark-submit ...`.
  spark:
    build:
      context: .
      dockerfile: spark/Dockerfile
    container_name: lakehouse-spark
    depends_on:
      - hive-metastore
    volumes:
      - ./spark/jobs:/opt/spark-jobs:ro
    entrypoint: ["tail", "-f", "/dev/null"]

  # DB backend riêng cho Airflow metadata (tách biệt với metastore-db của Trino).
  airflow-db:
    image: postgres:16
    container_name: lakehouse-airflow-db
    environment:
      POSTGRES_DB: airflow_db
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Chạy 1 lần: migrate DB metadata + tạo user admin (admin/admin, dev-only).
  airflow-init:
    <<: *airflow-common
    container_name: lakehouse-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - airflow db migrate && airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: lakehouse-airflow-webserver
    command: webserver
    ports:
      - "8081:8080"          # 8080 host đã dùng cho Trino UI
    depends_on:
      airflow-db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: lakehouse-airflow-scheduler
    command: scheduler
    depends_on:
      airflow-db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

volumes:
  minio-data:
  metastore-db-data:
  airflow-db-data:
